<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Form 12">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Form 12 – Selbstoptimierung</title>
<style>
:root{
  --bg:#fff;--bg2:#f2f2f7;--card:#fff;--sep:#e5e5ea;--text:#000;--text2:#8e8e93;--text3:#c7c7cc;--accent:#ff3b30;--blue:#007aff;
  --c-sport:#ff3b30;--c-lernen:#007aff;--c-bachelor:#af52de;--c-arbeit:#ff9500;--c-reflexion:#34c759;--c-lesen:#a2845e;--c-eigen:#8e8e93;--c-meal:#00b8a9;--c-schach:#5856d6;--c-englisch:#30b0c7;
  --hh:52px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1c1c1e;--card:#1c1c1e;--sep:#38383a;--text:#fff;--text2:#8e8e93;--text3:#48484a;--accent:#ff453a;--blue:#0a84ff;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
#app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
header.top{padding:calc(var(--safe-t) + 8px) 16px 6px;background:var(--bg);position:relative;z-index:5}
.toprow{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.back{color:var(--accent);font-size:17px;display:flex;align-items:center;gap:2px}
.icons{display:flex;gap:18px;color:var(--accent);font-size:22px;align-items:center}
.icons button{color:var(--accent);font-size:15px;font-weight:500}
h1.title{font-size:30px;font-weight:700;margin:4px 0 2px;letter-spacing:-.4px}
.subtitle{font-size:13px;color:var(--text2);margin-bottom:6px}
.seg{display:flex;background:var(--bg2);border-radius:9px;padding:2px;margin:6px 0 4px}
.seg button{flex:1;padding:6px 0;font-size:13px;font-weight:600;border-radius:7px;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
nav.tabs{display:flex;border-top:.5px solid var(--sep);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;min-width:0;padding:7px 0 5px;font-size:9.5px;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:25px;height:25px}
/* Wochenleiste */
.strip{position:sticky;top:0;z-index:6;background:var(--bg);display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:2px 8px 6px;border-bottom:.5px solid var(--sep);user-select:none}
.strip .wd{font-size:11px;color:var(--text2);font-weight:600}
.strip .dn{width:34px;height:34px;line-height:34px;margin:2px auto 0;border-radius:50%;font-size:19px}
.strip .sel .dn{background:var(--text);color:var(--bg);font-weight:600}
.strip .today .dn{color:var(--accent);font-weight:600}
.strip .sel.today .dn{background:var(--accent);color:#fff}
.strip .dots{height:6px;display:flex;justify-content:center;gap:2px;margin-top:2px}
.strip .dots i{width:5px;height:5px;border-radius:50%}
.dayhead{padding:10px 16px 4px;font-size:15px;font-weight:600}
.dayhead small{color:var(--text2);font-weight:400}
/* Zeitachse */
.grid{position:relative;margin-left:52px;border-left:.5px solid var(--sep)}
.hour{height:var(--hh);border-top:.5px solid var(--sep);position:relative}
.hour span{position:absolute;left:-48px;top:-8px;font-size:11px;color:var(--text2);width:42px;text-align:right}
.ev{position:absolute;left:3px;right:3px;border-radius:5px;padding:2px 6px 2px 8px;font-size:12px;line-height:1.25;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg));color:color-mix(in srgb,var(--c) 70%,var(--text));cursor:pointer;touch-action:pan-y;user-select:none}
.ev b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.5}.ev.done b{text-decoration:line-through}
.ev.dragging{opacity:.85;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;touch-action:none}
.nowline{position:absolute;left:-6px;right:0;height:2px;background:var(--accent);z-index:4}
.nowline:before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);margin-left:52px;position:sticky;top:0;background:var(--bg);z-index:6;border-bottom:.5px solid var(--sep)}
.wgrid div{text-align:center;font-size:11px;color:var(--text2);padding:4px 0}
.wgrid div b{display:block;font-size:17px;color:var(--text);font-weight:500}
.wgrid div.today b{color:var(--accent)}
.wcols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.wcols>div{position:relative;border-left:.5px solid var(--sep)}
.wcols .ev{font-size:10px;padding:1px 3px 1px 4px;left:1px;right:1px;border-left-width:2px}
/* Monat */
.month{display:grid;grid-template-columns:repeat(7,1fr);border-top:.5px solid var(--sep)}
.month .mh{font-size:11px;color:var(--text2);text-align:center;padding:4px 0;font-weight:600}
.month .md{min-height:92px;border-bottom:.5px solid var(--sep);padding:3px 2px;cursor:pointer;overflow:hidden}
.month .md.out{opacity:.35}
.month .md .n{font-size:15px;text-align:center;width:28px;height:28px;line-height:28px;margin:0 auto 2px;border-radius:50%}
.month .md.today .n{background:var(--accent);color:#fff;font-weight:600}
.month .md .mb{font-size:9.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 3px;margin-bottom:1px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.month .md .more{font-size:9.5px;color:var(--text2);padding-left:3px}
.mtitle{padding:12px 16px 4px;font-size:20px;font-weight:700;color:var(--accent)}
/* Liste */
.list{padding:0 0 30px}
.lhead{position:sticky;top:0;background:var(--bg2);padding:6px 16px;font-size:13px;font-weight:600;color:var(--text2);z-index:2}
.lhead.today{color:var(--accent)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--sep);background:var(--card)}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .tm{font-size:13px;color:var(--text2);width:84px;flex:none;font-variant-numeric:tabular-nums}
.row .tx{flex:1;min-width:0}
.row .tx b{font-weight:500;display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{color:var(--text2);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text3);flex:none;display:grid;place-items:center}
.chk.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.chk.on:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.done b{text-decoration:line-through;color:var(--text2)}
/* Sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg2);width:100%;max-width:640px;max-height:92vh;border-radius:14px 14px 0 0;overflow-y:auto;padding:0 0 calc(24px + var(--safe-b));animation:up .25s ease-out}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:14px;max-height:86vh}}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}@keyframes fade{from{opacity:0}}
.sh-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg2);z-index:3}
.sh-top button{color:var(--accent);font-size:17px}
.sh-top .ttl{font-weight:600}
.sec{background:var(--card);border-radius:10px;margin:0 16px 16px;overflow:hidden}
.sec h3{font-size:13px;color:var(--text2);text-transform:uppercase;font-weight:500;margin:0;padding:10px 16px 4px;letter-spacing:.2px}
.sec .it{padding:11px 16px;border-top:.5px solid var(--sep);display:flex;gap:10px;align-items:center;justify-content:space-between}
.sec .it:first-of-type{border-top:0}
.sec .it label{flex:1}
.sec .it input[type=time],.sec .it input[type=date],.sec .it input[type=number],.sec .it select{background:var(--bg2);border:0;border-radius:7px;padding:6px 8px;font-size:15px}
.sec .it input[type=number]{width:72px;text-align:right}
.sec textarea{width:100%;border:0;background:transparent;padding:12px 16px;min-height:110px;resize:vertical;font-size:15px}
.big{padding:6px 16px 14px}
.big h2{margin:0 0 4px;font-size:22px;font-weight:700}
.big .meta{color:var(--text2);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-right:6px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:.5px solid var(--sep);font-size:14.5px;line-height:1.35}
.task .chk{width:22px;height:22px;margin-top:1px}
.task.done span{color:var(--text2);text-decoration:line-through}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
.btn{background:var(--card);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--blue);font-weight:500}
.btn.red{color:var(--accent)}.btn.fill{background:var(--accent);color:#fff}
.sec .btn{background:var(--bg2)}.sec .btn.fill{background:var(--accent);color:#fff}
.wide{display:block;width:calc(100% - 32px);margin:0 16px 12px;padding:14px;border-radius:12px;font-size:17px;font-weight:600;text-align:center}
/* Training */
.ex{padding:10px 16px;border-top:.5px solid var(--sep)}
.ex .exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .exh b{font-weight:600;font-size:15px}
.ex .plan{font-size:13px;color:var(--text2)}
.ex .alt{font-size:12.5px;color:var(--blue)}
.sets{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px 8px;margin-top:8px;align-items:center;font-size:13px}
.sets input::placeholder{color:var(--text3);opacity:1}
.sets input{width:100%;background:var(--bg2);border:0;border-radius:7px;padding:7px 8px;font-size:15px;text-align:center}
.sets .sh{color:var(--text2);font-size:11px;text-transform:uppercase;text-align:center}
.hint{font-size:12.5px;color:var(--c-reflexion);margin-top:6px}
.note{font-size:13.5px;color:var(--text2);padding:8px 16px;line-height:1.4}
.empty{padding:40px 24px;text-align:center;color:var(--text2)}
.addbar{display:flex;gap:8px;padding:10px 16px}
.addbar input{flex:1;background:var(--bg2);border:0;border-radius:10px;padding:10px 12px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 8px}
.chips button{white-space:nowrap;background:var(--bg2);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.chips button.on{background:var(--text);color:var(--bg)}
.card{background:var(--card);border-radius:12px;margin:10px 16px;padding:14px 16px}
@media (prefers-color-scheme:light){main.gray{background:var(--bg2)}}
main.gray{background:var(--bg2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 16px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--text2);font-size:12px;display:block}
.kpi b{font-size:24px;font-weight:700}
svg.chart text{fill:var(--text2);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tw-day{margin:12px 16px 4px;font-size:13px;color:var(--text2);font-weight:600;text-transform:uppercase}
.navd{display:flex;align-items:center;gap:6px}.navd button{color:var(--accent);font-size:26px;width:30px;line-height:1}
.navd input{border:0;background:var(--bg2);border-radius:8px;padding:5px 8px;font-size:14px;color:var(--accent);font-weight:600}
.jumpw{position:relative;display:inline-block}.jumpw span{display:inline-block;background:var(--bg2);border-radius:8px;padding:5px 10px;font-size:14px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}.jumpw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0}
.ev.exam{background:color-mix(in srgb,var(--c-lernen) 85%,#000);color:#fff}
.csum{display:flex;width:calc(100% - 32px);margin:8px 16px;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c-meal) 25%,transparent)}
.csum b{display:block;font-size:15px}.csum small{color:var(--text2);font-size:12px}
.khero{background:var(--card);border-radius:18px;margin:10px 16px;padding:16px}
.kring{position:relative;width:132px;height:132px;margin:0 auto}.kring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kring b{font-size:28px;font-variant-numeric:tabular-nums}.kring small{font-size:12px;color:var(--text2)}
.keq{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0;text-align:center}.keq small{display:block;font-size:11px;color:var(--text2)}.keq b{font-size:16px}.keq span{color:var(--text2)}
.mrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.mr{display:flex;flex-direction:column;align-items:center}.mr small{font-size:12px;font-weight:600}.mr span{font-size:11px;color:var(--text2)}
.kmh{display:flex;align-items:center;gap:10px;padding:12px 16px}.kmh b{flex:1;font-size:16px}.kmh span{color:var(--text2);font-size:13px}.kmh button{color:var(--c-meal);font-size:22px;width:32px;height:32px;border-radius:50%;background:var(--bg2)}
.kit{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:.5px solid var(--sep)}.kit>div{flex:1;min-width:0}.kit b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kit small{color:var(--text2);font-size:12px;display:block}.kit>span{font-variant-numeric:tabular-nums;font-size:14px}.kit>button{color:var(--text2);font-size:18px;width:28px}
.kit.pick{cursor:pointer}.kit.sel{background:color-mix(in srgb,var(--c-meal) 12%,transparent)}.kit .plus{color:var(--c-meal);font-size:20px}.kit .fav{color:#ffcc00;font-size:18px}
.ksug{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}.ksug button{flex:none;max-width:220px;text-align:left;background:color-mix(in srgb,var(--c-meal) 12%,var(--card));border-radius:10px;padding:8px 10px}
.ksug b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ksug small{font-size:11.5px;color:var(--text2)}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px;margin-top:10px;align-items:end}
.wbars div{position:relative;height:110px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}
.wbars i{display:block;width:70%;background:var(--c-meal);border-radius:5px 5px 2px 2px}.wbars em{position:absolute;left:5%;right:5%;height:2px;background:var(--text2)}
.wbars small{position:absolute;bottom:-18px;font-size:11px;color:var(--text2)}.wbars .cur small{color:var(--accent);font-weight:700}
.chesscard{margin:0 16px 14px;padding:14px;border-radius:14px;background:#1f1d2b;color:#fff}.chesscard small{opacity:.7;font-size:12px}.chesscard b{display:block;font-size:17px;margin:3px 0}.chesscard span{font-size:13.5px;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;animation:fade .2s}
.slider{display:flex;align-items:center;gap:10px}.slider input{flex:1}
.prio{font-size:11px;color:var(--text2)}
/* v2: Bereiche & individuelle Designs */
.focus{background:var(--card);border-radius:12px;margin:0 16px 14px;padding:12px 14px}
.athlete .focus{background:transparent;margin:0;padding:0}
.focus .fk{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:15px;line-height:1.3}
.fbadge{background:var(--c-sport);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;flex:none}
.fchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fchips div{background:var(--bg2);border-radius:10px;padding:8px 10px}
.athlete .fchips div{background:rgba(255,255,255,.08)}
.fchips small{display:block;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.athlete .fchips small{color:rgba(255,255,255,.55)}
.fchips span{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.focus details{margin-top:10px;font-size:13px;color:var(--text2)}.focus details p{margin:6px 0;line-height:1.4}
.focus summary{cursor:pointer;color:var(--c-sport);font-weight:600;font-size:13px}
.athlete{background:#111;color:#fff;border-radius:16px;margin:12px 16px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.athlete .at-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.8px;color:var(--c-sport);font-weight:700;margin-bottom:10px;text-transform:uppercase;gap:8px}
.athlete .at-top span:last-child{color:rgba(255,255,255,.55);text-align:right}
.athlete details p{color:rgba(255,255,255,.7)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.tile{background:var(--card);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:112px;position:relative;overflow:hidden}
.tile i{width:34px;height:34px;border-radius:10px;background:var(--c);margin-bottom:auto;color:#fff;font-style:normal;display:grid;place-items:center;font-size:18px;font-weight:600}
.tile b{font-size:16px;margin-top:14px}.tile small{color:var(--text2);font-size:12.5px}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--c,var(--c-lernen));border-radius:3px}
details.subj{background:var(--card);margin:10px 16px;border-radius:12px;overflow:hidden}
details.subj summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
details.subj summary::-webkit-details-marker{display:none}
details.subj summary div:first-child{width:46%}details.subj summary b{display:block}details.subj summary small{color:var(--text2);font-size:12px}
details.subj summary span{font-size:12px;color:var(--text2);width:52px;text-align:right}
.task .push{margin-left:auto;color:var(--blue);font-size:17px;padding:0 4px;flex:none}
.task em.from{font-style:normal;font-size:11px;color:var(--c-lernen);background:color-mix(in srgb,var(--c-lernen) 12%,transparent);padding:1px 6px;border-radius:6px;margin-left:4px}
.btn[disabled]{opacity:.4}
/* Lesereise – Buch-Look */
.book{margin:4px 16px 14px;padding:16px;border-radius:14px;background:#f6efe2;color:#3b2f22;font-family:ui-serif,"New York",Georgia,serif;box-shadow:inset 0 0 0 1px rgba(90,60,30,.12)}
@media (prefers-color-scheme:dark){.book{background:#2a231b;color:#efe3cf}}
.bk-top{display:flex;justify-content:space-between;font-size:12px;opacity:.7;margin-bottom:8px;font-family:-apple-system,sans-serif}

/* Mealprep */
.mealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 16px 14px}
.mcard{background:linear-gradient(160deg,color-mix(in srgb,var(--c-meal) 20%,var(--card)),var(--card));border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:110px}
.mcard small{color:var(--c-meal);font-weight:600;font-size:11.5px}.mcard b{font-size:15px;line-height:1.25}.mcard span{font-size:12px;color:var(--text2);margin-top:auto}
.rc-head{padding:4px 16px 12px}.rc-head small{color:var(--c-meal);font-weight:600}.rc-head h2{margin:4px 0 10px;font-size:23px}

.stepn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c-meal);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}
/* Bachelor */
.bday{display:flex;gap:14px;background:var(--card);margin:10px 16px;border-radius:14px;padding:14px;cursor:pointer;--c:var(--c-bachelor)}
.bday .bd-n{width:36px;height:36px;border-radius:50%;background:var(--c-bachelor);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.bday .tx{flex:1;display:flex;flex-direction:column;gap:4px}.bday small{color:var(--text2);font-size:12px}.bday.done{opacity:.6}
.nutri{background:var(--card);border-radius:12px;margin:8px 16px;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c-meal) 25%,transparent)}
.nutri summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.nutri summary::-webkit-details-marker{display:none}
.nutri summary b{display:block;font-size:15px}.nutri summary small{color:var(--text2);font-size:12px}
.ring{width:42px;height:42px;border-radius:50%;flex:none;background:conic-gradient(var(--c-meal) calc(var(--v)*1%),var(--bg2) 0);display:grid;place-items:center}

.macros b{font-size:16px;font-variant-numeric:tabular-nums}.macros b span{font-size:11px;color:var(--text2);font-weight:500}
.macros .bar{position:relative;margin:5px 0 3px;--c:var(--c-meal);background:var(--sep)}.macros .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text2)}
.macros .high b span{color:#e08a00}.macros .low b span{color:#e08a00}
.nutri .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:.5px solid var(--sep)}
.nutri .it label{flex:1}.nutri .it input[type=number]{background:var(--bg2);border:0;border-radius:7px;padding:6px 8px;font-size:15px;width:80px;text-align:right}

.sec-sub{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;padding:12px 16px 2px;border-top:.5px solid var(--sep)}
.cnt{display:flex;align-items:center;gap:12px}.cnt button{width:30px;height:30px;border-radius:50%;background:var(--bg2);font-size:18px;color:var(--c-meal)}.cnt b{min-width:16px;text-align:center}
.water{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.water button{width:14px;height:26px;border-radius:5px 5px 4px 4px;border:1.5px solid #5ac8fa}.water button.on{background:#5ac8fa}
.fuel{margin:0 16px 14px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--c-meal) 14%,var(--card))}

.fuel b{font-size:14px;color:var(--c-meal)}.fuel span{font-size:14.5px;line-height:1.4}.fuel small{font-size:12px;color:var(--text2)}
.chessboard{display:flex;gap:14px;align-items:center;margin:12px 16px;background:#1f1d2b;color:#fff;border-radius:16px;padding:14px}
.cb-grid{display:grid;grid-template-columns:repeat(8,1fr);width:88px;height:88px;flex:none;border-radius:6px;overflow:hidden}
.cb-grid i{background:#e9e4d8}.cb-grid i.d{background:#5856d6}
.cb-txt b{display:block;font-size:17px;margin-bottom:4px}.cb-txt span{font-size:13.5px;opacity:.8;line-height:1.4}
.dhero{display:flex;gap:16px;align-items:center;margin:10px 16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--card))}
.dh-txt small{color:var(--text2);font-size:12.5px}.dh-txt b{display:block;font-size:19px;margin:2px 0;line-height:1.2}.dh-txt span{font-size:13.5px;color:var(--text2)}

.drings div{display:flex;flex-direction:column;align-items:center;gap:4px}.drings small{font-size:12px;color:var(--text2)}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 6px}.dstats div{background:var(--card);border-radius:12px;padding:10px}
.dstats b{font-size:22px;display:block}.dstats small{font-size:11.5px;color:var(--text2);line-height:1.25;display:block}
.wcard-w{display:flex;gap:12px;align-items:center;margin:12px 16px;padding:14px;border-radius:14px;background:#1c1c1e;color:#fff}
.wcard-w b{display:block}.wcard-w span{font-size:13px;opacity:.75}.wcard-w .btn{flex:none}

.tr-card{background:#16161b;border:1px solid #24242b;border-radius:16px;margin:0 12px 12px;padding:14px}

.tr-card.rest p{color:#9a9aa3;font-size:14px;margin:6px 0 0}
.tr-ch{display:flex;justify-content:space-between;gap:10px;align-items:center}.tr-ch small{color:#9a9aa3;font-size:12px;font-weight:600}.tr-ch b{display:block;font-size:18px;margin-top:2px;letter-spacing:-.2px}
.tr-chk{width:34px;height:34px;border-radius:17px;border:2px solid #3a3a42;color:transparent;font-weight:800;flex:none}.tr-chk.on{background:#32d74b;border-color:#32d74b;color:#0b0b0e}
.tr-prog{height:4px;border-radius:2px;background:#2a2a31;margin:12px 0 4px;overflow:hidden}.tr-prog i{display:block;height:100%;background:#32d74b}
.tr-pl{font-size:11px;color:#8e8e93;margin-bottom:4px}
.tr-it{font-size:13.5px;color:#c7c7cc;padding:6px 0;border-top:1px solid #222228;line-height:1.35}.tr-it.n{color:#8e8e93;font-size:12.5px}
.tr-ex{background:#1c1c22;border-radius:12px;padding:12px;margin:10px 0 4px}
.tr-exh{display:flex;justify-content:space-between;align-items:center}.tr-exh b{font-size:15.5px}
.tr-alt{width:30px;height:30px;border-radius:8px;background:#2a2a31;color:#ff9f0a;font-weight:700}
.tr-tg{font-size:12.5px;color:#ff9f0a;font-weight:700;margin-top:2px}.tr-tg .up{color:#32d74b}
.tr-last{font-size:12px;color:#8e8e93;margin-top:4px}
.tr-sets{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:6px;margin-top:10px;align-items:center}
.tr-sets>span{font-size:10.5px;color:#6e6e76;text-transform:uppercase;letter-spacing:.4px;text-align:center}.tr-sets .sn{font-size:14px;color:#c7c7cc;font-weight:700}
.tr-sets input{background:#26262d;border:1px solid #303038;border-radius:9px;padding:9px 6px;text-align:center;color:#f2f2f7;font-variant-numeric:tabular-nums;width:100%;box-sizing:border-box;font-size:16px}
.tr-sets input::placeholder{color:#5b5b63}
.tr-sok{height:38px;border-radius:9px;background:#26262d;border:1px solid #303038;color:#5b5b63;font-weight:800}.tr-sok.on{background:#32d74b;border-color:#32d74b;color:#0b0b0e}
.tr-fb{margin-top:12px;padding-top:10px;border-top:1px solid #2a2a31;display:grid;gap:8px}.tr-fb small{font-size:11px;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px}
.tr-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:3px}.tr-seg button{background:#26262d;border-radius:8px;padding:7px 0;font-size:13px;color:#c7c7cc}.tr-seg button.on{background:#ff453a;color:#fff}
.tr-rec{background:rgba(50,215,75,.1);border:1px solid rgba(50,215,75,.25);color:#b8f5c4;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.35}
.tr-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:10px}.tr-chips div{background:#1f1f26;border-radius:10px;padding:7px 9px}.tr-chips small{display:block;font-size:10.5px;color:#8e8e93;text-transform:uppercase}.tr-chips b{font-size:14px}
.tr-more{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 0 0;border-top:1px solid #222228;color:#ff9f0a;font-size:14px;font-weight:600}
.tr-ref{display:block;margin:4px 12px;width:calc(100% - 24px);text-align:left;background:#16161b;border:1px solid #24242b;border-radius:12px;padding:12px 14px;color:#c7c7cc;font-size:14px}

en", "date": "2027-01-07", "q": "eine Stimme gebe?", "lec": "Kellerloch, Teil II, Kap. 4: Zwei Stimmen"}, {"wd": "Fr", "label": "Alte Regel", "date": "2027-01-08", "q": "Welche Regel über Streit und Wut habe ich früh gelernt, und gilt sie heute noch?", "lec": "Kellerloch, Teil II, Kap. 5: Alte Regel"}], "read": "Kellerloch, Teil II, Kap. 1–5", "ther": "Konfliktvermeidung ist oft Beziehungsvermeidung. Ärger ist eine Information über Grenzen und Werte, kein Fehler. Ziel ist, Spannung auszuhalten und klar zu sprechen.", "action": "Führe das eine überfällige Gespräch (mit einer Ich-Botschaft: „Ich erlebe …, ich brauche …“). Sage zusätzlich täglich einmal bewusst Nein.", "leit": "Welchem notwendigen Konflikt weiche ich noch aus?", "buch": "", "range": "04.01. – 10.01.2027"}, {"w": 8, "name": "Ecdysis", "sub": "Häutung", "phase": "PHASE II · DIAGNOSE · AUFZEICHNUNGEN AUS DEM KELLERLOCH", "days": [{"wd": "Mo", "label": "Bedürfnis", "date": "2027-01-11", "q": "Welches Verhalten streife ich ab, und welches Bedürfnis wollte es erfüllen?", "lec": "Kellerloch, Teil II, Kap. 6: Bedürfnis"}, {"wd": "Di", "label": "Kette", "date": "2027-01-12", "q": "Was passierte davor (Ort, Gefühl, Uhrzeit, Person), im Moment und danach?", "lec": "Kellerloch, Teil II, Kap. 7: Kette"}, {"wd": "Mi", "label": "Impuls-Surfen", "date": "2027-01-13", "q": "Wie fühlt sich ein Drang im Körper an, wenn ich ihn zehn Minuten beobachte, ohne zu handeln?", "lec": "Kellerloch, Teil II, Kap. 8: Impuls-Surfen"}, {"wd": "Do", "label": "Wenn-Dann", "date": "2027-01-14", "q": "Welche gesunde Alternative erfüllt dasselbe Bedürfnis, und wie lautet mein Wenn-Dann-Plan?", "lec": "Kellerloch, Teil II, Kap. 9: Wenn-Dann"}, {"wd": "Fr", "label": "Nicht Allein", "date": "2027-01-15", "q": "Wer weiß von meinem Vorhaben, und wen will ich einweihen, damit ich nicht allein bin?", "lec": "Kellerloch, Teil II, Kap. 10: Nicht Allein"}], "read": "Kellerloch, Teil II, Kap. 6–10", "ther": "Hinter jedem Suchtmuster steht ein Bedürfnis (Ruhe, Nähe, Betäubung, Stimulation). Du analysierst Auslöser, übst Impuls-Surfen und planst Alternativen. Bei echter Abhängigkeit gehört professionelle Begleitung dazu.", "action": "Führe ein Auslöser-Protokoll (Wann, wo, Gefühl, Folge). Übe täglich Impuls-Surfen: Drang 10 Minuten beobachten, ohne zu handeln.", "leit": "Welche alte Sucht oder Eigenschaft streife ich jetzt ab?", "buch": "", "range": "11.01. – 17.01.2027"}, {"w": 9, "name": "Cruor", "sub": "Physis", "phase": "PHASE III · TRANSFORMATION · DER MYTHOS DES SISYPHOS", "days": [{"wd": "Mo", "label": "Aufgeben", "date": "2027-01-18", "q": "Welcher Gedanke taucht auf, kurz bevor ich aufgeben will, und ist er ein Fakt oder eine Empfehlung meines Komforts?", "lec": "Sisyphos – Das Absurde und der Selbstmord (1. Hälfte): Aufgeben"}, {"wd": "Di", "label": "Körpersignale", "date": "2027-01-19", "q": "Was spüre ich gerade in Kiefer, Schultern, Atem und Bauch, und was will mir das sagen?", "lec": "Sisyphos – Das Absurde und der Selbstmord (2. Hälfte): Körpersignale"}, {"wd": "Mi", "label": "Mehr Als Gedacht", "date": "2027-01-20", "q": "Wo habe ich heute mehr gegeben, als ich dachte, und was sagt das über meine Selbsteinschätzung?", "lec": "Sisyphos – Die absurden Mauern (Anfang): Mehr Als Gedacht"}, {"wd": "Do", "label": "Verbündeter", "date": "2027-01-21", "q": "Behandle ich meinen Körper als Feind, Werkzeug oder Verbündeten? Was ändert sich, wenn ich ihn als Verbündeten behandle?", "lec": "Sisyphos – Die absurden Mauern (Mitte): Verbündeter"}, {"wd": "Fr", "label": "Erholung", "date": "2027-01-22", "q": "Wo vernachlässige ich Schlaf, Pausen und Regeneration, und was sage ich mir, um das zu rechtfertigen?", "lec": "Sisyphos – Die absurden Mauern (Ende): Erholung"}], "read": "Sisyphos: Das Absurde und der Selbstmord · Die absurden Mauern", "ther": "Körperliche Anstrengung stärkt Selbstwirksamkeit, Stimmung und Stressresistenz. Wichtig: Disziplin ist nicht Selbstbestrafung, Erholung gehört zum Training.", "action": "Täglich eine bewusst unbequeme Einheit (Training, Lauf, Intervalle), mit Plan und Pause. Bei gesundheitlichen Fragen ärztlich abklären.", "leit": "Wo will mein Verstand aufgeben, obwohl der Körper noch kann?", "buch": "", "range": "18.01. – 24.01.2027"}, {"w": 10, "name": "Autonomie", "sub": "Meisterschaft", "phase": "PHASE III · TRANSFORMATION · DER MYTHOS DES SISYPHOS", "days": [{"wd": "Mo", "label": "Ohne Publikum", "date": "2027-01-25", "q": "Welche Handlung heute war vom Wunsch nach Anerkennung gesteuert, und was hätte ich ohne Publikum getan?", "lec": "Sisyphos – Der philosophische Selbstmord (Anfang): Ohne Publikum"}, {"wd": "Di", "label": "Lob Und Kritik", "date": "2027-01-26", "q": "Wie fühlen sich Lob und Kritik im Körper an, und wie lasse ich beides durchziehen, ohne mich zu verlieren?", "lec": "Sisyphos – Der philosophische Selbstmord (Mitte): Lob Und Kritik"}, {"wd": "Mi", "label": "Das Freie Leben", "date": "2027-01-27", "q": "Wie sieht mein intensives, freies Leben in zwölf Monaten konkret aus (Alltag, Menschen, Orte, Abenteuer)?", "lec": "Sisyphos – Der philosophische Selbstmord (Ende): Das Freie Leben"}, {"wd": "Do", "label": "Nicht Verhandelbar", "date": "2027-01-28", "q": "Welche drei Dinge sind für die nächsten 90 Tage nicht verhandelbar, und wie schütze ich sie?", "lec": "Sisyphos – Die absurde Freiheit (1. Hälfte): Nicht Verhandelbar"}, {"wd": "Fr", "label": "Innerer Mentor", "date": "2027-01-29", "q": "Wie spreche ich mit mir, wenn ich versage: wie ein Feind, ein Richter oder ein Mentor, der an mich glaubt?", "lec": "Sisyphos – Die absurde Freiheit (2. Hälfte): Innerer Mentor"}], "read": "Sisyphos: Der philosophische Selbstmord · Die absurde Freiheit", "ther": "Autonomie, Kompetenz und Verbundenheit sind die Grundlagen dauerhafter Motivation. Das Ziel ist ein Leben, das du selbst wählst, nicht eines, das Applaus verwaltet.", "action": "Verbringe einen „Tag ohne Publikum“ (kein Posten, keine Rechtfertigung). Plane dann deine nächsten 90 Tage mit einem echten Abenteuer.", "leit": "Wie handle ich vollkommen frei von Urteil, Lob und Angst?", "buch": "", "range": "25.01. – 31.01.2027"}, {"w": 11, "name": "Ubiquity", "sub": "Präsenz", "phase": "PHASE III · TRANSFORMATION · DER MYTHOS DES SISYPHOS", "days": [{"wd": "Mo", "label": "Kleinmachen", "date": "2027-02-01", "q": "Wo mache ich mich klein (Stimme, Haltung, Blick, Weichmacher-Wörter), und was will ich damit verhindern?", "lec": "Sisyphos – Der absurde Mensch · Der Don Juanismus: Kleinmachen"}, {"wd": "Di", "label": "Unausgesprochen", "date": "2027-02-02", "q": "Welche Aussage hätte ich heute gern gemacht, und was wäre realistisch das Schlimmste gewesen?", "lec": "Sisyphos – Der absurde Mensch · Die Schauspielerei: Unausgesprochen"}, {"wd": "Mi", "label": "Willkommen", "date": "2027-02-03", "q": "Wie würde ich einen Raum betreten, wenn ich wüsste, dass ich willkommen bin?", "lec": "Sisyphos – Der absurde Mensch · Die Eroberung: Willkommen"}, {"wd": "Do", "label": "Grenzen", "date": "2027-02-04", "q": "Wo habe ich heute eine Grenze klar, freundlich und ohne Rechtfertigung gesetzt, und wo nicht?", "lec": "Sisyphos – Das absurde Schaffen (1. Hälfte): Grenzen"}, {"wd": "Fr", "label": "Raum Im Kopf", "date": "2027-02-05", "q": "Wem gebe ich zu viel Raum in meinem Kopf und wem zu wenig in meinem Leben?", "lec": "Sisyphos – Das absurde Schaffen (2. Hälfte): Raum Im Kopf"}], "read": "Sisyphos: Der absurde Mensch · Das absurde Schaffen", "ther": "Kernwoche für ein extravertiertes Leben. Sichtbarkeit ist erlernbar: Stimme, Blick, Haltung und klare Sprache. Kleine Experimente widerlegen die Angst vor Ablehnung.", "action": "Täglich ein Präsenz-Experiment: Augenkontakt halten, laut und langsam sprechen, in einer Gruppe als Erste:r etwas sagen, Fragen ohne „eigentlich/vielleicht“.", "leit": "Wo mache ich mich klein und wie nehme ich Raum ein?", "buch": "", "range": "01.02. – 07.02.2027"}, {"w": 12, "name": "Renascor & Synthese", "sub": "Erneuerung & Einheit", "phase": "PHASE III · TRANSFORMATION · DER MYTHOS DES SISYPHOS", "days": [{"wd": "Mo", "label": "Erkenntnisse", "date": "2027-02-08", "q": "Welche drei Erkenntnisse der letzten zehn Wochen haben mein Verhalten messbar verändert?", "lec": "Sisyphos – Der Mythos des Sisyphos: Erkenntnisse"}, {"wd": "Di", "label": "Heldenreise", "date": "2027-02-09", "q": "Wenn ich mein Leben als Heldenreise erzähle: Was war der Ruf, die Prüfung, die Wandlung?", "lec": "Sisyphos – Der Mythos des Sisyphos, zweites Lesen: Heldenreise"}, {"wd": "Mi", "label": "Widerspruch", "date": "2027-02-10", "q": "Wo sage ich A, fühle B und tue C?", "lec": "Sisyphos – Anhang zu Kafka (Anfang): Widerspruch"}, {"wd": "Do", "label": "Kongruenz", "date": "2027-02-11", "q": "Was sind meine fünf wichtigsten Werte, und wo war ich diese Woche zu 100 % im Einklang mit ihnen?", "lec": "Sisyphos – Anhang zu Kafka (Mitte): Kongruenz"}, {"wd": "Fr", "label": "Offene Rechnung", "date": "2027-02-12", "q": "Wem schulde ich eine Entschuldigung, einen Dank oder ein klares Wort, damit ich frei vorwärtsgehen kann?", "lec": "Sisyphos – Anhang zu Kafka (Ende): Offene Rechnung"}], "read": "Sisyphos: Der Mythos des Sisyphos · Anhang zu Kafka", "ther": "Integration: Aus Erkenntnissen wird eine zusammenhängende Lebensgeschichte, und Denken, Fühlen und Handeln werden deckungsgleich (Kongruenz).", "action": "Schreibe dein Manifest („Ich bin jemand, der …“, 10 Sätze). Erzähle einer vertrauten Person von deiner Veränderung und bitte um ehrliches Feedback.", "leit": "Wer bin ich, wenn meine Vergangenheit kein Hindernis mehr ist?", "buch": "", "range": "08.02. – 14.02.2027"}], "audit": ["Muster-Analyse: Welches Gefühl oder Verhalten hat meine Woche am stärksten geprägt?", "Buch-Spiegel: In welcher Figur oder Szene habe ich mich diese Woche wiedererkannt?", "Fortschritts-Check: Wo habe ich im Sinne des Wochenthemas spürbar Boden gutgemacht?", "Korrektur-Kurs: Welche Stellschraube justiere ich für die kommende Woche nach?"]}, "grid": "2026-11-23", "recipes": [{"id": "r1", "name": "Erdnuss-Bowl mit Räuchertofu & Brokkoli", "short": "Reis · Räuchertofu · Brokkoli · Erdnuss-Sauce", "kcal": 1188, "p": 59, "min": 40, "ing": [["Basmati- oder Jasminreis (trocken)", 150, "g"], ["Räuchertofu", 200, "g"], ["Brokkoli", 200, "g"], ["Erdnussmus (100 %)", 30, "g"], ["Sojasauce", 15, "ml"], ["Limettensaft", 10, "ml"], ["Ahornsirup oder Honig", 10, "g"], ["Ingwer, frisch gerieben", 5, "g"], ["Knoblauchzehe", 0.5, "Stk"], ["Neutrales Öl", 5, "ml"]], "steps": ["Reis mit 1,5-facher Wassermenge 12 Min köcheln, 10 Min ziehen lassen, dann auf einem Blech ausbreiten und schnell abkühlen.", "Räuchertofu würfeln und in Öl 6–8 Min knusprig braten.", "Brokkoli in Röschen 4 Min dämpfen (noch bissfest – er gart beim Aufwärmen nach).", "Sauce: Erdnussmus, Sojasauce, Limette, Sirup, Ingwer, Knoblauch und 2–3 EL heißes Wasser glatt rühren – separat abfüllen.", "In Boxen schichten: Reis, Brokkoli, Tofu. Sauce erst nach dem Aufwärmen darüber."], "store": "Kühlschrank bis 4 Tage. Reis innerhalb 1 Std. kühlen (Bacillus cereus).", "tip": "Für mehr Kalorien: 15 g geröstete Erdnüsse drüber (+90 kcal).", "f": 42, "c": 141}, {"id": "r2", "name": "Süßkartoffel-Püree mit Kichererbsen, Tofu & Spinat", "short": "Süßkartoffel · Kichererbsen · Tofu · Spinat", "kcal": 884, "p": 44, "min": 40, "ing": [["Süßkartoffel", 400, "g"], ["Kichererbsen (abgetropft)", 120, "g"], ["Tofu natur", 200, "g"], ["Babyspinat", 100, "g"], ["Olivenöl", 15, "ml"], ["Paprikapulver geräuchert", 1, "TL"], ["Kreuzkümmel", 0.5, "TL"], ["Zitronensaft", 10, "ml"], ["Salz, Pfeffer", 1, "Prise"]], "steps": ["Süßkartoffeln schälen, würfeln, 15 Min in Salzwasser weich kochen, mit 1/3 des Öls und Zitronensaft stampfen.", "Ofen 220 °C: Kichererbsen trocken tupfen, mit Öl, Paprika und Kreuzkümmel 20 Min rösten.", "Tofu in Würfel schneiden, scharf anbraten, salzen.", "Spinat roh in die Box legen – beim Aufwärmen fällt er zusammen.", "Püree unten, Spinat, Tofu und Kichererbsen obenau chen-Notiz: häufigster Fehler der Woche"}}, "rules": [{"n": 1, "t": "Zentrum halten, nicht „neben“ das Zentrum schlagen", "d": "Gegen das Damengambit mit …e6 ablehnen statt mit …dxc4 das Zentrum herzugeben. Zentrumsbauer gegen Zentrumsbauer tauschen ist ok.", "w": "1"}, {"n": 2, "t": "Du musst nicht alles schlagen", "d": "Erst entwickeln, dann schlagen, wenn es etwas bringt.", "w": "1"}, {"n": 3, "t": "Keine Damen-Ausflüge in der Eröffnung", "d": "Wer früh mit der Dame Bauern holt oder Tempi verliert, entwickelt langsamer und wird überrannt.", "w": "1"}, {"n": 4, "t": "„Continuity“: Was deckt die Figur nicht mehr?", "d": "Nach jedem gegnerischen Zug fragen: Welches Feld hat die gezogene Figur verlassen? Hier entstehen die meisten Gewinnchancen.", "w": "2–3"}, {"n": 5, "t": "Den Verteidiger beseitigen", "d": "Schlagen, sodass ein Bauer nicht mehr zwei Dinge decken kann.", "w": "5"}, {"n": 6, "t": "Langschrittler: Wie weit sehen sie? Immer nach Schachs suchen", "d": "Dame und Läufer sehen über das ganze Brett. Viele übersehen Schachs.", "w": "2–7"}, {"n": 7, "t": "Drohungen ohne Hoffnung", "d": "Drohungen spielen, die etwas gewinnen, auch wenn der Gegner sie pariert (z. B. Mattdrohung plus Bauerngewinn).", "w": "7"}, {"n": 8, "t": "Rochade verzögern", "d": "Hast du rochiert und der Gegner nicht: die Figur angreifen oder fesseln, die seine Rochade schützt.", "w": "7, 11"}, {"n": 9, "t": "„Im Zweifel: Turm ins Spiel“", "d": "Türme auf offene oder halboffene Linien, später auf die 2. Reihe des Gegners.", "w": "9"}, {"n": 10, "t": "Bauernstruktur und Vorposten", "d": "Keine Tausche, die eigene Doppelbauern erzeugen. Figuren auf Vorposten stellen. Eigene lange Diagonale nicht zubauen.", "w": "9"}, {"n": 11, "t": "Tauschen, wenn du vorne bist – aber mit Luft", "d": "Mit Material-Plus Figuren tauschen. Vorher Luft für den König schaffen (h3/h6).", "w": "10"}, {"n": 12, "t": "Bauernendspiel: aktiver König, Opposition, Zugzwang", "d": "König nach vorne, Feld für Feld. Bauern n function phaseName(s){if(s<START||s>END)return '';const w=pweek(s);if(w>12){const r=readWeek(s);return r?'Lesereise W'+r.w+' · '+r.name:''}const T=DATA.training[Math.max(1,w)];return T?T.phase.replace(/\s*\(.*?\)/,'').replace(/^PHASE (\d):/,'Phase $1:').toLowerCase().replace(/(^|\s)(\S)/g,(a,b,c)=>b+c.toUpperCase()):''}
function stripHTML(s){const mo=mondayOf(s);let h='<div class="strip" id="strip">';for(let i=0;i<7;i++){const d=addD(mo,i),es=evOn(d);const cats=[...new Set(es.map(e=>e.cat))].slice(0,4);
  h+=`<div class="${d===s?'sel':''} ${d===today()?'today':''}" data-d="${d}"><div class="wd">${WD[i][0]}</div><div class="dn">${parse(d).getDate()}</div><div class="dots">${cats.map(c=>`<i style="background:${CATS[c].c}"></i>`).join('')}</div></div>`}
  return h+'</div>'}
function bindStrip(){const st=$('#strip');st.onclick=e=>{const x=e.target.closest('[data-d]');if(x){S.ui.sel=x.dataset.d;save();render()}};
  let x0=null;st.ontouchstart=e=>x0=e.touches[0].clientX;st.ontouchend=e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){S.ui.sel=addD(sel(),dx<0?7:-7);save();render()}x0=null}}
const H0=5,H1=24;
function timeline(cols){let h='';for(let H=H0;H<H1;H++)h+=`<div class="hour"><span>${pad(H)}:00</span></div>`;return h}
function evBlock(e,narrow){const top=(e.start/60-H0)*parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'));const hh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'));let ht=Math.max(18,(e.end-e.start)/60*hh-2);if(e._cap!=null)ht=Math.max(11,Math.min(ht,e._cap/60*hh-2));
  return `<div class="ev ${isDone(e)?'done':''} ${e.exam?'exam':''} ${ht<16?'xs':''}" data-id="${e.id}" style="--c:${CATS[e.cat].c};top:${top}px;height:${ht}px;${e._l!=null?`left:calc(${e._l*100}% + 2px);width:calc(${e._w*100}% - 4px);right:auto`:''}"><b>${esc(e.title)}</b>${narrow||ht<34?'':`<span>${hm(e.start)}–${hm(e.end)}${e.sub?' · '+esc(e.sub):''}</span>`}</div>`}
function layout(es){const VE=e=>Math.max(e.end,e.start+10);const cols=[];es.forEach(e=>{let c=0;while(cols[c]&&cols[c]>e.start)c++;cols[c]=VE(e);e._c=c});
  es.forEach(e=>{const ov=es.filter(o=>o.start<VE(e)&&VE(o)>e.start);const n=Math.max(...ov.map(o=>o._c))+1;e._l=n>1?e._c/n:null;e._w=n>1?1/n:null});
  es.forEach(e=>{const nx=es.filter(o=>o!==e&&o._c===e._c&&o.start>=e.end).map(o=>o.start);e._cap=nx.length?Math.min(...nx)-e.start:null});return es}
function todosFor(d){return S.todos.filter(t=>t.date===d||(!t.done&&t.date&&t.date<d&&d===today()))}
function renderDay(){
  const s=sel(),es=layout(evOn(s).map(e=>Object.assign({},e)));

  h+=`<div class="grid" id="grid" data-d="${s}">${timeline()}${es.map(e=>evBlock(e)).join('')}${s===today()?`<div class="nowline" style="top:${((new Date().getHours()*60+new Date().getMinutes())/60-H0)*52}px"></div>`:''}</div><div style="height:40px"></div>`;
  $('#main').innerHTML=h;bindStrip();bindTodoRows();bindEvents($('#grid'),false);$('#csum').onclick=()=>{S.ui.tab='kcal';S.ui.fdate=s;save();render();$('#main').scrollTop=0};
  let x0=null;const g=$('#grid');g.addEventListener('touchstart',e=>x0=[e.touches[0].clientX,e.touches[0].clientY],{passive:true});g.addEventListener('touchend',e=>{if(!x0||drag)return;const dx=e.changedTouches[0].clientX-x0[0],dy=e.changedTouches[0].clientY-x0[1];if(Math.abs(dx)>70&&Math.abs(dy)<40){S.ui.sel=addD(sel(),dx<0?1:-1);save();render()}x0=null});
  if(!renderDay.scrolled){renderDay.scrolled=1;scrollNow()}

function scrollNow(){requestAnimationFrame(()=>{const m=$('#main');const s=sel();const es=evOn(s);const first=es.length?Math.min(...es.map(e=>e.start)):480;const t=s===today()?new Date().getHours()*60-60:first-30;m.scrollTop=Math.max(0,(t/60-H0)*52)})}
function renderWeek(){
  const s=sel(),mo=mondayOf(s);
  let h=`<div class="wgrid">${[0,1,2,3,4,5,6].map(i=>{const d=addD(mo,i);return `<div class="${d===today()?'today':''}" data-d="${d}">${WD[i]}<b>${parse(d).getDate()}</b></div>`}).join('')}</div>`;
  h+=`<div class="grid" id="grid">${timeline()}<div class="wcols">${[0,1,2,3,4,5,6].map(i=>{const d=addD(mo,i);return `<div data-d="${d}">${layout(evOn(d).map(e=>Object.assign({},e))).map(e=>evBlock(e,true)).join('')}</div>`}).join('')}</div></div><div style="height:40px"></div>`;
  $('#main').innerHTML=h;

function renderMonth(){

function syncRef(id){const c=S.custom.find(x=>x.id===id);if(c&&c.ref&&c.ref.t==='learn'){if(S.done[id])S.td[c.ref.key]=1;else delete S.td[c.ref.key]}}
function toggleDone(id){S.done[id]=!S.done[id];if(!S.done[id])delete S.done[id];syncRef(id);save();refresh()}

/* Ziehen & Verschieben (lange drücken, dann ziehen) */
let drag=null;
function bindEvents(grid,week){
  grid.querySelectorAll('.ev').forEach(el=>{
    let timer=null,startY,startX,moved=false;
    el.addEventListener('pointerdown',ev=>{startY=ev.clientY;startX=ev.clientX;moved=false;
      timer=setTimeout(()=>{drag={el,id:el.dataset.id,y0:startY,x0:startX,top0:parseFloat(el.style.top),week};el.classList.add('dragging');try{el.setPointerCapture(ev.pointerId)}catch(e){};navigator.vibrate&&navigator.vibrate(15)},ev.pointerType==='mouse'?180:380)});
    el.addEventListener('pointermove',ev=>{if(!drag||drag.el!==el){if(Math.abs(ev.clientY-startY)>8||Math.abs(ev.clientX-startX)>8)clearTimeout(timer);return}
      ev.preventDefault();moved=true;const dy=ev.clientY-drag.y0;el.style.top=(drag.top0+dy)+'px';
      if(week){el.style.transform=`translateX(${ev.clientX-drag.x0}px)`}});
    el.addEventListener('pointerup',ev=>{clearTimeout(timer);
      if(drag&&drag.el===el){const hh=52,dy=ev.clientY-drag.y0;const e=EV.find(x=>x.id===drag.id);const dmin=Math.round(dy/hh*60/15)*15;let nd=e.date;
        if(week){el.style.visibility='hidden';const under=document.elementFromPoint(ev.clientX,ev.clientY);el.style.visibility='';const col=under&&under.closest('.wcols>div');if(col)nd=col.dataset.d}
        drag=null;if(moved&&(dmin||nd!==e.date)){moveEvent(e,nd,e.start+dmin);return}el.classList.remove('dragging');el.style.transform='';el.style.top=parseFloat(el.style.top)+'px';refresh();return}
      if(Math.abs(ev.clientY-startY)<8&&Math.abs(ev.clientX-startX)<8) openEvent(el.dataset.id)});
    el.addEventListener('pointercancel',()=>{clearTimeout(timer);if(drag&&drag.el===el){drag=null;refresh()}});
    el.addEventListener('touchmove',ev=>{if(drag&&drag.el===el)ev.preventDefault()},{passive:false});
  });
}
function moveEvent(e,date,start){start=Math.max(0,Math.min(23*60+45,start));const dur=e.end-e.start;
  if(e.id.startsWith('C-')){const c=S.custom.find(x=>x.id===e.id);Object.assign(c,{date,start,end:start+dur})}
  else S.ov[e.id]=Object.assign({},S.ov[e.id],{date,start,end:start+dur});
  save();refresh();toast(`${e.title.slice(0,28)} → ${WD[wdi(date)]} ${parse(date).getDate()}.${parse(date).getMonth()+1}. ${hm(start)}`)}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}

/* ---------- Sheets ---------- */
function sheet(title,html,onDone,leftLabel='Schließen'){

  bg.innerHTML=`<div class="sheet" role="dialog"><div class="sh-top"><button data-x>${leftLabel}</button><span class="ttl">${esc(title)}</span><button data-ok style="font-weight:600">${onDone?'Fertig':''}</button></div>${html}</div>`;

function openEvent(id){

  if(e.id.startsWith('C-')||e.cat==='arbeit'||e.cat==='bachelor') h+=`<div class="sec"><h3>Notizen</h3><textarea id="evNote" placeholder="Notizen …">${esc((S.ov[id]||{}).note||(S.custom.find(c=>c.id===id)||{}).note||'')}</textarea></div>`;
  if(e.derived) h+=`<div class="note">Die Wegzeit hängt automatisch vor der Arbeit. Verschiebe die Arbeit, dann wandert sie mit.</div>`;

}
function moveSection(e){

    <div class="it"><label>Ende</label><input type="time" id="mvE" value="${hm(e.end)}" step="900"></div>
    <div class="btnrow"><button class="btn" data-sh="-1">− 1 Tag</button><button class="btn" data-sh="1">+ 1 Tag</button><button class="btn" data-sh="7">+ 1 Woche</button>${e.grp&&EV.filter(x=>x.grp===e.grp&&!x.derived).length>1?`<button class="btn" id="mvGrp">Ganzen Block (${EV.filter(x=>x.grp===e.grp&&!x.derived).length} Termine) mitnehmen</button>`:''}</div>

function bindMove(el,e,sh){const id=e.id;

  const d=el.querySelector('#evDel');if(d)d.onclick=()=>{if(id.startsWith('C-'))S.custom=S.custom.filter(c=>c.id!==id);else S.ov[id]=Object.assign({},S.ov[id],{del:true});save();sh.close();refresh();toast('Ausgeblendet – unter Bereiche › Einstellungen wiederherstellbar')};}
function saveEventSheet(e,bg){

let _rsegs=null;
function readSegs(){if(_rsegs)return _rsegs;_rsegs=[];DATA.meta.weeks.forEach(w=>w.days.forEach(d=>_rsegs.push({...d,w:w.w,book:w.w<=4?'Klassische Texte der Philosophie':w.w<=8?'Aufzeichnungen aus dem Kellerloch':'Der Mythos des Sisyphos'})));return _rsegs}
const bookOf=i=>readSegs()[i].book;
const segTitle=i=>readSegs()[i].lec.split(':')[0];
function readWeek(d){if(d<START)return null;const k=Math.floor((parse(d)-parse(DATA.readBase))/864e5/7);return DATA.meta.weeks[Math.max(0,k)]||null}
function readingPlan(){
  const R=readSegs(),T=today(),out={};
  const U=R.map((_,i)=>i).filter(i=>S.rd[i]!==1);let u=0;let cnt=R.length-U.length;
  for(let d=START;d<=END;d=addD(d,1)){const w=wdi(d);if(w===5)continue;
    const target=R.filter(x=>x.date<=d).length;
    if(d<T){const lg=S.rdLog[d]||[];const planned=R.map((x,i)=>x.date===d?i:-1).filter(i=>i>=0);if(lg.length)out[d]={segs:lg,past:1};else if(planned.length)out[d]={segs:planned,past:1};continue}
    const lg=d===T?(S.rdLog[d]||[]):[];let segs=[];
    const behind=target-cnt;
    if(behind>0){const n=Math.min(behind,2,U.length-u);segs=U.slice(u,u+n);u+=n;cnt+=n}
    else if(u<U.length&&R.some(x=>x.date===d)){segs=[U[u]];out[d]={opt:1}}
    const all=[...new Set([...lg,...segs])].sort((x,y)=>x-y);
    if(all.length)out[d]=Object.assign(out[d]||{},{segs:all});
  }
  return out}
function readStatus(){const R=readSegs(),T=today();const planned=R.filter(x=>x.date<T).length;const done=R.reduce((s,_,i)=>s+(S.rd[i]===1?1:S.rd[i]===.5?.5:0),0);return {planned,done,diff:done-planned,total:R.length}}

   ${(()=>{const nx=R.findIndex((x,i)=>!slot.segs.includes(i)&&S.rd[i]!==1&&i>Math.max(...slot.segs));return nx>=0?`<button class="bk-more" data-more="${nx}">＋ Mehr gelesen: ${esc(R[nx].lec.split(':')[0])}</button>`:''})()}
   </div>
   <div class="note">Liest du mehr, wird es aus den nächsten Tagen genommen. Liest du weniger, rutscht der Rest auf den nächsten Lesetag (Freitag ist Puffer).</div>`;
  h+=`<div class="sec"><h3>Was nehme ich mit?</h3><textarea id="rdN" placeholder="Ein Satz, ein Zitat, eine Szene …">${esc((S.reading[e.date]||{}).note||'')}</textarea></div>`;

  const el=sh.el;

  el.querySelectorAll('.bseg').forEach(b=>b.querySelectorAll('[data-rs]').forEach(x=>x.onclick=()=>{const i=+b.dataset.seg;setSeg(i,+x.dataset.rs);b.className='bseg '+(S.rd[i]===1?'done':S.rd[i]===.5?'half':'');b.querySelectorAll('[data-rs]').forEach(y=>y.classList.toggle('on',S.rd[i]===+y.dataset.rs))}));

function doBackup(){S.lastBackup=today();save();download(`form12-backup-${today()}.json`,JSON.stringify(S),'application/json');toast('Backup gespeichert – in „Dateien“ ablegen')}
function download(name,text,type){
  let framed=false;try{framed=window.top!==window.self}catch(e){framed=true}
  if(!framed){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return}
  const sh=sheet(name,`<div class="note">In dieser Vorschau sind Downloads gesperrt. In der installierten App (Home-Bildschirm) wird die Datei direkt geladen. Hier kannst du den Inhalt kopieren und als <b>${esc(name)}</b> speichern.</div><button class="wide btn fill" id="cp">Inhalt kopieren</button><div class="sec"><textarea readonly style="min-height:240px;font-family:ui-monospace,monospace;font-size:11px">${esc(text.slice(0,200000))}</textarea></div>`);
  sh.el.querySelector('#cp').onclick=()=>{navigator.clipboard.writeText(text).then(()=>toast('Kopiert'),()=>toast('Kopieren nicht erlaubt – Text markieren und kopieren'))}}
function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function fold(l){const out=[];while(l.length>73){out.push(l.slice(0,73));l=' '+l.slice(73)}out.push(l);return out.join('\r\n')}
function exportICS(){
  const r=$('#icsR').value,cats=[...document.querySelectorAll('[data-icsc]')].filter(c=>c.checked).map(c=>c.dataset.icsc),alarm=+$('#icsA').value||0,mor=$('#icsM').checked;
  let from=START,to=END;if(r==='fut')from=today()>START?today():START;if(r==='wk'){from=mondayOf(sel());to=addD(from,6)}
  const es=EV.filter(e=>cats.includes(e.cat)&&e.date>=from&&e.date<=to&&(mor||e.sess?.kind!=='morning'));
  const dt=(d,m)=>d.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Form12//Selbstoptimierung//DE','CALSCALE:GREGORIAN','X-WR-CALNAME:Form 12','X-WR-TIMEZONE:Europe/Berlin',
   'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
  es.forEach(e=>{let desc=CATS[e.cat].n+' (Prio '+CATS[e.cat].p+')';if(e.sub)desc+='\n'+e.sub;
    if(e.sess)desc+='\n\n'+e.sess.items.map(i=>'• '+i.t).join('\n');if(e.tasks&&e.tasks.length)desc+='\n\n'+e.tasks.map(t=>'☐ '+t).join('\n');if(e.slot)desc+='\n\n'+e.slot.segs.map(i=>readSegs()[i].lec).join('\n');if(e.meal)desc+='\n\n'+e.meal.map(x=>x.r.name+' ('+x.for+')').join('\n');if(e.seg)desc+='\n\n'+segTasks(e.id).map(t=>'☐ '+t.t).join('\n');
    L.push('BEGIN:VEVENT','UID:'+e.id+'@form12','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(e.date,e.start),'DTEND;TZID=Europe/Berlin:'+dt(e.date,Math.min(e.end,1439)),fold('SUMMARY:'+icsEsc(e.title)),fold('DESCRIPTION:'+icsEsc(desc.slice(0,1800))),'CATEGORIES:'+icsEsc(CATS[e.cat].n));
    if(e.sess){const loc=(e.sess.items.find(i=>/^Ort:/.test(i.t))||{}).t;if(loc)L.push(fold('LOCATION:'+icsEsc(loc.replace('Ort: ',''))))}
    if(alarm&&(e.cat==='sport'||(e.cat==='arbeit'&&!e.derived)))L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:-PT'+alarm+'M','END:VALARM');
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');download(`form12-${from}-bis-${to}.ics`,L.join('\r\n'),'text/calendar');toast(es.length+' Termine exportiert');
}

function calTarget(d){const P=S.profile,w=avg7(d||today())||curWeight(d);
  const bmr=Math.round(10*w+6.25*P.h-5*P.age+(P.sex==='w'?-161:5));const tdee=Math.round(bmr*P.pal);
  const k=Math.round((tdee+P.gain*7700/7+S.calAdj)/10)*10;const p=Math.round(2.0*w),f=Math.round(1.4*w),c=Math.max(0,Math.round((k-4*p-9*f)/4));
  return {bmr,tdee,k,p,f,c,w}}
function foodList(d){return S.food[d]||[]}
function foodTotals(d){const t={k:0,p:0,f:0,c:0};foodList(d).forEach(x=>{t.k+=x.k;t.p+=x.p;t.f+=x.f;t.c+=x.c});for(const k in t)t[k]=Math.round(t[k]);return t}
function planRecipes(){const N=DATA.nutrition;const o=[];
  o.push({id:'pl-f',name:'Frühstück (Plan)',short:N.breakfast.d,kcal:N.breakfast.k,p:N.breakfast.p,f:N.breakfast.f,c:N.breakfast.c,grp:'Plan'});
  o.push({id:'pl-sup',name:'Supplements (Öle)',short:'Schwarzkümmelöl 1 EL, Olivenöl 2 TL',kcal:190,p:0,f:20,c:3,grp:'Plan'});
  o.push({id:'pl-pre',name:'Banane vor dem Training',short:N.pre.d,kcal:N.pre.k,p:N.pre.p,f:N.pre.f,c:N.pre.c,grp:'Plan'});
  o.push({id:'pl-shake',name:'Recovery-Shake',short:N.shake.d,kcal:N.shake.k,p:N.shake.p,f:N.shake.f,c:N.shake.c,grp:'Plan'});
  o.push({id:'pl-snack',name:'Snack: Banane + Toast',short:N.snack.d,kcal:N.snack.k,p:N.snack.p,f:N.snack.f,c:N.snack.c,grp:'Plan'});
  o.push({id:'pl-quark',name:'Quark mit Nüssen',short:N.quark.d,kcal:N.quark.k,p:N.quark.p,f:N.quark.f,c:N.quark.c,grp:'Plan'});
  N.dinners.forEach((x,i)=>o.push({id:'pl-d'+i,name:'Abend: '+x[0],short:x[1],kcal:x[2],p:x[3],f:x[4],c:x[5],grp:'Abendessen'}));
  return o}
function allRecipes(){return DATA.recipes.map(r=>({...r,grp:'Mealprep'})).concat(planRecipes(),S.myRecipes.map(r=>({...r,grp:'Eigene'})))}
function allFoods(){return DATA.foods.concat(S.myFoods)}
function recipeById(id){return allRecipes().find(r=>r.id===id)}
function foodById(id){return allFoods().find(f=>f.id===id)}
function addFood(d,meal,item){(S.food[d]=S.food[d]||[]).push(Object.assign({id:'fe'+Date.now()+Math.random().toString(36).slice(2,5),m:meal},item));save()}
function logRecipe(d,meal,r,por,prep){addFood(d,meal,{n:r.name,q:(por===1?'1 Portion':String(por).replace('.',',')+' Portionen'),k:Math.round(r.kcal*por),p:Math.round(r.p*por),f:Math.round(r.f*por),c:Math.round(r.c*por),src:{t:'recipe',ref:r.id,por,prep:prep||null}})}
function logFood(d,meal,f,grams,label){const x=grams/100;addFood(d,meal,{n:f.n,q:label||grams+' g',k:Math.round(f.k*x),p:Math.round(f.p*x*10)/10,f:Math.round(f.f*x*10)/10,c:Math.round(f.c*x*10)/10,src:{t:'food',ref:f.id,g:grams}})}
/* Mealprep: gekochte Portionen und Reste */
function cookedOf(eid){const e=EV.find(x=>x.id===eid);const c=S.cooked[eid];if(c)return c;if(e&&isDone(e)&&e.meal)return {date:e.date,items:e.meal.map(x=>({rid:x.r.id,por:x.por+(x.for==='Mo'&&false?0:0)}))};return null}
function prepLeft(d){const out=[];EV.filter(e=>e.meal&&e.date<=d&&e.date>=addD(d,-6)).forEach(e=>{const c=cookedOf(e.id);if(!c)return;
  c.items.forEach(it=>{let used=0;for(const k in S.food)S.food[k].forEach(x=>{if(x.src&&x.src.prep===e.id&&x.src.ref===it.rid)used+=x.src.por||1});
    const left=Math.round((it.por-used)*10)/10;const r=recipeById(it.rid);if(left>0&&r)out.push({r,left,eid:e.id,date:e.date})})});return out}
function recentItems(){const seen={},out=[];Object.keys(S.food).sort().reverse().forEach(d=>S.food[d].slice().reverse().forEach(x=>{if(x.src&&!seen[x.n]&&out.length<8){seen[x.n]=1;out.push(x)}}));return out}
function planSuggest(d,meal){const ids=[];const w=wdi(d);
  if(meal==='f')ids.push('pl-f','pl-sup');
  if(meal==='d'){const dn=EV.find(e=>e.date===d&&e.nut==='dinner');if(dn)ids.push('pl-d'+DATA.nutrition.dinners.findIndex(x=>x[0]===dn.dn[0]))}
  if(meal==='s'){const m=EV.find(e=>e.date===d&&e.sess&&MAINK.includes(e.sess.kind));if(m)ids.push('pl-pre','pl-shake');else ids.push('pl-snack','pl-quark')}
  return ids.map(recipeById).filter(Boolean)}
function macroRing(v,t,c,n){return `<div class="mr">${ringSVG(t?v/t:0,c,58,6,Math.round(v))}<small>${n}</small><span>/ ${t} g</span></div>`}

  const d=S.ui.fdate||today();const T=calTarget(d),E=foodTotals(d);const rest=T.k-E.k;
  $('#hdr').innerHTML=`<div class="toprow"><div class="navd"><button id="fp">‹</button><label class="jumpw"><span>${d.slice(8)}.${d.slice(5,7)}.${d.slice(0,4)}</span><input type="date" id="fj" value="${d}"></label><button id="fn">›</button></div><div class="icons"><button id="fT">Heute</button></div></div>
    <h1 class="title">Kalorien</h1><div class="subtitle">${fmtLong(d)}</div>`;
  $('#fp').onclick=()=>{S.ui.fdate=addD(d,-1);save();render()};$('#fn').onclick=()=>{S.ui.fdate=addD(d,1);save();render()};
  $('#fj').onchange=e=>{if(e.target.value){S.ui.fdate=e.target.value;save();render()}};$('#fT').onclick=()=>{S.ui.fdate=today();save();render()};
  let h=`<div class="khero"><div class="kring">${ringSVG(E.k/T.k,rest<0?'#ff9500':'var(--c-meal)',132,12,'')}<div><b>${Math.abs(rest)}</b><small>${rest>=0?'kcal übrig':'kcal drüber'}</small></div></div>
    <div class="keq"><div><small>Ziel</small><b>${T.k}</b></div><span>−</span><div><small>Gegessen</small><b>${E.k}</b></div><span>=</span><div><small>Rest</small><b>${rest}</b></div></div>
    <div class="mrs">${macroRing(E.p,T.p,'#ff375f','Protein')}${macroRing(E.c,T.c,'#0a84ff','Kohlenh.')}${macroRing(E.f,T.f,'#ffd60a','Fett')}</div></div>`;
  const L=foodList(d);

    h+=`<div class="sec kmeal"><div class="kmh"><b>${n}</b><span>${sum} kcal</span><button data-add="${m}">＋</button></div>`;
    h+=it.map(x=>`<div class="kit"><div><b>${esc(x.n)}</b><small>${esc(x.q)} · P ${Math.round(x.p)} · KH ${Math.round(x.c)} · F ${Math.round(x.f)}</small></div><span>${Math.round(x.k)}</span><button data-del="${x.id}" aria-label="Löschen">×</button></div>`).join('');
    if(m==='l'){const pl=prepLeft(d);if(pl.length&&!it.length)h+=`<div class="ksug">${pl.map((x,i)=>`<button data-prep="${i}"><b>${esc(x.r.name)}</b><small>Mealprep · noch ${String(x.left).replace('.',',')} Portion${x.left===1?'':'en'}</small></button>`).join('')}</div>`}
    else{const ps=planSuggest(d,m);if(ps.length&&!it.length)h+=`<div class="ksug">${ps.map(r=>`<button data-plan="${r.id}"><b>${esc(r.name)}</b><small>Plan · ${r.kcal} kcal</small></button>`).join('')}</div>`}
    h+='</div>'});
  // Getränke + Supplements
  const wt=waterTarget(d),wa=S.water[d]||0,D=S.drinks[d]||{};
  h+=`<div class="sec"><h3>Getränke</h3><div class="it"><label>Wasser <small style="color:var(--text2);display:block">Ziel ${String(wt).replace('.',',')} l ≈ ${Math.ceil(wt/0.75)} Flaschen à 0,75 l</small></label><div class="water">${Array.from({length:Math.ceil(wt/0.75)},(_,i)=>`<button data-wat="${i+1}" class="${wa>=i+1?'on':''}"></button>`).join('')}</div></div>
   ${[['coffee','Kaffee'],['tea','Tee']].map(([k,n])=>`<div class="it"><label>${n} <small style="color:var(--text2);display:block">Tassen à 250 ml</small></label><div class="cnt"><button data-dr="${k}" data-v="-1">−</button><b>${D[k]||0}</b><button data-dr="${k}" data-v="1">+</button></div></div>`).join('')}
   <div class="note">Getrunken: <b>${String(Math.round((wa*0.75+(D.coffee||0)*0.25+(D.tea||0)*0.25)*100)/100).replace('.',',')} l</b>. Kaffee am besten bis ca. 14 Uhr.</div></div>
   <div class="sec"><h3>Supplements morgens</h3>${SUPPS.map(([k,n])=>`<div class="task ${(S.supp[d]||{})[k]?'done':''}" data-sup="${k}"><button class="chk ${(S.supp[d]||{})[k]?'on':''}" style="--c:var(--c-meal)"></button><span>${esc(n)}</span></div>`).join('')}</div>`;
  // Woche
  const mo=mondayOf(d);let wk=[];for(let i=0;i<7;i++){const x=addD(mo,i);wk.push({d:x,k:foodTotals(x).k,t:calTarget(x).k})}
  const mx=Math.max(...wk.map(x=>Math.max(x.k,x.t)))*1.1||1;const logged=wk.filter(x=>x.k>0);
  h+=`<div class="card"><b>Wochenübersicht</b><div class="wbars">${wk.map(x=>`<div class="${x.d===d?'cur':''}" data-fd="${x.d}"><i style="height:${x.k/mx*100}%;${x.k>x.t*1.05?'background:#ff9500':''}"></i><em style="bottom:${x.t/mx*100}%"></em><small>${WD[wdi(x.d)]}</small></div>`).join('')}</div>
   <div class="note" style="padding:6px 0 0">Ø ${logged.length?Math.round(logged.reduce((a,x)=>a+x.k,0)/logged.length):0} kcal an ${logged.length} eingetragenen Tagen · Strich = Tagesziel</div></div>`;
  // Gewicht
  const wp=Object.entries(S.weight).sort().map(([x,v])=>({x:pweek(x)+wdi(x)/7,y:v}));const ap=Object.keys(S.weight).sort().map(x=>({x:pweek(x)+wdi(x)/7,y:avg7(x)})).filter(p=>p.y);
  const a=avg7(d),b=avg7(addD(d,-7));const g=a!=null&&b!=null?a-b:null;
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Gewicht</b><span><input type="number" step="0.1" id="kw" value="${S.weight[d]??''}" placeholder="${String(curWeight(d)).replace('.',',')}" style="width:80px;text-align:right;border:0;background:var(--bg2);border-radius:8px;padding:6px"> kg</span></div>
   ${chart([{n:'Ziel min',c:'var(--text3)',dash:1,pts:[1,12].map(w=>({x:w,y:Math.round((S.profile.w0+0.25*(w-1))*10)/10}))},{n:'Ziel max',c:'var(--text3)',dash:1,pts:[1,12].map(w=>({x:w,y:Math.round((S.profile.w0+0.5*(w-1))*10)/10}))},{n:'Messwert',c:'var(--c-meal)',pts:wp},{n:'7-Tage-Schnitt',c:'var(--c-sport)',pts:ap}],{xmin:1})}
   <div class="note" style="padding:6px 0 0">${weightAdvice(d)}</div>
   ${g!=null&&(g<0.15||g>0.5)?`<div class="btnrow" style="padding:6px 0 0"><button class="btn fill" id="adj">${g<0.15?'+200 kcal ins Ziel übernehmen':'−200 kcal ins Ziel übernehmen'}</button></div>`:''}</div>`;
  // Ziele
  const P=S.profile;
  h+=`<div class="sec"><h3>Ziele & Körperdaten</h3>
   <div class="it"><label>Startgewicht (kg)</label><input type="number" step="0.1" id="pw0" value="${P.w0}"></div>
   <div class="it"><label>Zielgewicht (kg)</label><input type="number" step="0.1" id="pgo" value="${P.goal}"></div>
   <div class="it"><label>Größe (cm)</label><input type="number" id="ph" value="${P.h}"></div>
   <div class="it"><label>Alter</label><input type="number" id="pa" value="${P.age}"></div>
   <div class="it"><label>Geschlecht</label><select id="psx"><option value="m" ${P.sex==='m'?'selected':''}>männlich</option><option value="w" ${P.sex==='w'?'selected':''}>weiblich</option></select></div>
   <div class="it"><label>Aktivität</label><select id="ppal">${[[1.6,'1,6 · Studium, 3–4 Einheiten'],[1.7,'1,7 · 5–6 Einheiten'],[1.8,'1,8 · täglich Training (Plan)'],[1.9,'1,9 · sehr aktiv']].map(([v,n])=>`<option value="${v}" ${+P.pal===v?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="it"><label>Zunahme pro Woche</label><select id="pg">${[[0.25,'+0,25 kg'],[0.35,'+0,35 kg'],[0.5,'+0,5 kg']].map(([v,n])=>`<option value="${v}" ${+P.gain===v?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="note">Grundumsatz ${T.bmr} kcal (Mifflin-St Jeor, ${String(T.w).replace('.',',')} kg) × Aktivität = Erhaltung ${T.tdee} kcal, + Überschuss ${Math.round(P.gain*7700/7)} kcal${S.calAdj?` ${S.calAdj>0?'+':''}${S.calAdj} kcal Anpassung`:''} = <b>${T.k} kcal</b>. Protein 2,0 g/kg = ${T.p} g · Fett 1,4 g/kg = ${T.f} g · Rest Kohlenhydrate = ${T.c} g.<br>Zum Vergleich deine Sportplan-PDF: Erhaltung 3.100–3.400, Ziel 3.400–3.700 kcal, Protein 140–160 g, Fett 90–110 g, KH 450–500 g.</div>

  m.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const r=recipeById(b.dataset.plan);const meal=b.closest('.kmeal').querySelector('[data-add]').dataset.add;logRecipe(d,meal,r,1);render();toast('Eingetragen')});
