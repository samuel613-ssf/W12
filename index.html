function openAddFood(d,meal,ctx){
  const mealName=(MEALS.find(x=>x[0]===meal)||[,''])[1];let q='',tab='sug';
  const sh=sheet(mealName+' · '+shortD(d),'<div id="afb"></div>');const box=sh.el.querySelector('#afb');
  const draw=()=>{const L=foodList(d).filter(x=>x.m===meal);let h='';
    if(L.length)h+=`<div class="sec"><h3>Eingetragen · ${Math.round(L.reduce((a,x)=>a+x.k,0))} kcal</h3>${L.map(x=>`<div class="kit"><div><b>${esc(x.n)}</b><small>${esc(x.q)}</small></div><span>${Math.round(x.k)}</span><button data-del="${x.id}">×</button></div>`).join('')}</div>`;
    h+=`<div class="addbar"><input id="afq" placeholder="Rezept oder Lebensmittel suchen …" value="${esc(q)}"></div>
      <div class="chips">${[['sug','Vorschläge'],['rec','Rezepte'],['food','Lebensmittel'],['own','Eigenes']].map(([k,n])=>`<button class="${tab===k?'on':''}" data-tab2="${k}">${n}</button>`).join('')}</div>`;
    const R=allRecipes(),F=allFoods();const fav=x=>S.fav[x]?'★':'☆';
    const recRow=r=>`<div class="kit pick" data-r="${r.id}"><div><b>${esc(r.name)}</b><small>${r.grp} · ${r.kcal} kcal · P ${r.p} · KH ${r.c} · F ${r.f} / Portion</small></div><button class="fav" data-fav="${r.id}">${fav(r.id)}</button></div>`;
    const foodRow=f=>`<div class="kit pick" data-f="${f.id}"><div><b>${esc(f.n)}</b><small>${f.k} kcal / 100 g${f.u?` · 1 ${f.un} = ${f.u} g`:''}</small></div><button class="fav" data-fav="${f.id}">${fav(f.id)}</button></div>`;
    if(q){const ql=q.toLowerCase();h+=`<div class="sec">${R.filter(r=>r.name.toLowerCase().includes(ql)).map(recRow).join('')}${F.filter(f=>f.n.toLowerCase().includes(ql)).map(foodRow).join('')||''}</div>`}
    else if(tab==='sug'){const pl=prepLeft(d),ps=planSuggest(d,meal),rc=recentItems(),fv=[...R.filter(r=>S.fav[r.id]),...F.filter(f=>S.fav[f.id])];
      if(pl.length)h+=`<div class="sec"><h3>Aus deinem Mealprep</h3>${pl.map((x,i)=>`<div class="kit pick" data-pl="${i}"><div><b>${esc(x.r.name)}</b><small>gekocht ${WD[wdi(x.date)]} ${shortD(x.date)} · noch ${String(x.left).replace('.',',')} Portion${x.left===1?'':'en'} · ${x.r.kcal} kcal</small></div><span class="plus">＋</span></div>`).join('')}</div>`;
      if(ps.length)h+=`<div class="sec"><h3>Laut Plan</h3>${ps.map(recRow).join('')}</div>`;
      if(fv.length)h+=`<div class="sec"><h3>Favoriten</h3>${fv.map(x=>x.name?recRow(x):foodRow(x)).join('')}</div>`;
      if(rc.length)h+=`<div class="sec"><h3>Zuletzt</h3>${rc.map((x,i)=>`<div class="kit pick" data-rc="${i}"><div><b>${esc(x.n)}</b><small>${esc(x.q)} · ${Math.round(x.k)} kcal</small></div><span class="plus">＋</span></div>`).join('')}</div>`;
      if(!pl.length&&!ps.length&&!fv.length&&!rc.length)h+='<div class="note">Noch keine Vorschläge – such oben oder wähle unter Rezepte / Lebensmittel.</div>'}
    else if(tab==='rec'){['Mealprep','Abendessen','Plan','Eigene'].forEach(g=>{const l=R.filter(r=>r.grp===g);if(l.length)h+=`<div class="sec"><h3>${g}</h3>${l.map(recRow).join('')}</div>`})}
    else if(tab==='food'){h+=`<div class="sec">${F.slice().sort((a,b)=>(S.fav[b.id]?1:0)-(S.fav[a.id]?1:0)||a.n.localeCompare(b.n)).map(foodRow).join('')}</div>`}
    else h+=`<div class="sec"><h3>Schnell eintragen</h3><div class="it"><input id="qn" placeholder="Name (z. B. Döner)" style="border:0;background:none;width:100%"></div>
      ${[['qk','kcal'],['qp','Protein g'],['qc','Kohlenhydrate g'],['qf','Fett g']].map(([i,n])=>`<div class="it"><label>${n}</label><input type="number" id="${i}"></div>`).join('')}
      <div class="btnrow"><button class="btn fill" id="qadd">Eintragen</button><button class="btn" id="qsaveF">Als Lebensmittel (je 100 g) speichern</button><button class="btn" id="qsaveR">Als Rezept (je Portion) speichern</button></div></div>`;
    box.innerHTML=h;bind()};
  const bind=()=>{const b=box;
    const qi=b.querySelector('#afq');qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;draw();const n=box.querySelector('#afq');n.focus();n.setSelectionRange(pos,pos)};
    b.querySelectorAll('[data-tab2]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab2;draw()});
    b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{S.food[d]=foodList(d).filter(y=>y.id!==x.dataset.del);save();draw();render()});
    b.querySelectorAll('[data-fav]').forEach(x=>x.onclick=ev=>{ev.stopPropagation();const k=x.dataset.fav;if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();draw()});
    b.querySelectorAll('[data-pl]').forEach(x=>x.onclick=()=>{const it=prepLeft(d)[+x.dataset.pl];logRecipe(d,meal,it.r,1,it.eid);draw();render();toast('1 Portion eingetragen')});
    b.querySelectorAll('[data-rc]').forEach(x=>x.onclick=()=>{const it=recentItems()[+x.dataset.rc];addFood(d,meal,{n:it.n,q:it.q,k:it.k,p:it.p,f:it.f,c:it.c,src:Object.assign({},it.src,{prep:null})});draw();render();toast('Eingetragen')});
    b.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>pickRecipe(d,meal,recipeById(x.dataset.r),()=>{draw();render()}));
    b.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>pickFood(d,meal,foodById(x.dataset.f),()=>{draw();render()}));
    const qa=b.querySelector('#qadd');if(qa){const val=i=>+String(b.querySelector('#'+i).value||0).replace(',','.');const nm=()=>b.querySelector('#qn').value.trim()||'Eigener Eintrag';
      qa.onclick=()=>{addFood(d,meal,{n:nm(),q:'1×',k:val('qk'),p:val('qp'),f:val('qf'),c:val('qc'),src:{t:'quick'}});draw();render();toast('Eingetragen')};
      b.querySelector('#qsaveF').onclick=()=>{S.myFoods.push({id:'mf'+Date.now(),n:nm(),k:val('qk'),p:val('qp'),f:val('qf'),c:val('qc'),u:null,un:null});save();toast('Lebensmittel gespeichert');tab='food';draw()};
      b.querySelector('#qsaveR').onclick=()=>{S.myRecipes.push({id:'mr'+Date.now(),name:nm(),short:'eigenes Rezept',kcal:val('qk'),p:val('qp'),f:val('qf'),c:val('qc')});save();toast('Rezept gespeichert');tab='rec';draw()}}};
  draw();
}
function pickRecipe(d,meal,r,done){let por=1;const sh=sheet(r.name,'<div id="prb"></div>',()=>{logRecipe(d,meal,r,por);done&&done();toast('Eingetragen')},'Abbrechen');
  const draw=()=>{sh.el.querySelector('#prb').innerHTML=`<div class="big"><h2>${esc(r.name)}</h2><div class="meta">${esc(r.short||'')}</div></div>
    <div class="sec"><div class="it"><label>Portionen</label><div class="cnt"><button data-s="-0.5">−</button><b>${String(por).replace('.',',')}</b><button data-s="0.5">+</button></div></div>
    <div class="note">${Math.round(r.kcal*por)} kcal · P ${Math.round(r.p*por)} g · KH ${Math.round(r.c*por)} g · F ${Math.round(r.f*por)} g</div></div>`;
    sh.el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{por=Math.max(0.5,por+ +b.dataset.s);draw()})};draw()}
function pickFood(d,meal,f,done){let unit=f.u?'u':'g',amt=f.u?1:100;const sh=sheet(f.n,'<div id="pfb"></div>',()=>{const g=unit==='u'?amt*f.u:amt;logFood(d,meal,f,g,unit==='u'?`${String(amt).replace('.',',')} ${f.un}`:`${g} g`);done&&done();toast('Eingetragen')},'Abbrechen');
  const draw=()=>{const g=unit==='u'?amt*f.u:amt,x=g/100;sh.el.querySelector('#pfb').innerHTML=`<div class="big"><h2>${esc(f.n)}</h2><div class="meta">${f.k} kcal · P ${f.p} · KH ${f.c} · F ${f.f} je 100 g</div></div>
    <div class="sec"><div class="it"><label>Menge</label><input type="number" id="pfa" value="${amt}" step="${unit==='u'?0.5:10}"></div>
    ${f.u?`<div class="chips" style="padding:8px 16px"><button class="${unit==='u'?'on':''}" data-u="u">${f.un} (${f.u} g)</button><button class="${unit==='g'?'on':''}" data-u="g">Gramm</button></div>`:''}
    <div class="note">${g} g = ${Math.round(f.k*x)} kcal · P ${Math.round(f.p*x)} g · KH ${Math.round(f.c*x)} g · F ${Math.round(f.f*x)} g</div></div>`;
    const a=sh.el.querySelector('#pfa');a.onchange=()=>{amt=+String(a.value).replace(',','.')||0;draw()};
    sh.el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const nu=b.dataset.u;if(nu!==unit){amt=nu==='u'?1:f.u;unit=nu;draw()}})};draw()}
function openFoodDB(){let tab='rec';const sh=sheet('Datenbank','<div id="dbb"></div>');
  const draw=()=>{let h=`<div class="chips">${[['rec','Rezepte'],['food','Lebensmittel'],['new','Neu anlegen']].map(([k,n])=>`<button class="${tab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}</div>`;
    if(tab==='rec')h+=`<div class="sec">${allRecipes().map(r=>`<div class="kit"><div><b>${esc(r.name)}</b><small>${r.grp} · ${r.kcal} kcal · P ${r.p} · KH ${r.c} · F ${r.f}</small></div>${r.grp==='Eigene'?`<button data-dr="${r.id}">×</button>`:r.ing?`<button data-open="${r.id}">›</button>`:''}</div>`).join('')}</div>`;
    else if(tab==='food')h+=`<div class="sec">${allFoods().map(f=>`<div class="kit"><div><b>${esc(f.n)} ${S.fav[f.id]?'★':''}</b><small>je 100 g: ${f.k} kcal · P ${f.p} · KH ${f.c} · F ${f.f}${f.u?` · 1 ${f.un} = ${f.u} g`:''}</small></div>${String(f.id).startsWith('mf')?`<button data-df="${f.id}">×</button>`:''}</div>`).join('')}</div>`;
    else h+=`<div class="sec"><h3>Neues Lebensmittel (je 100 g)</h3><div class="it"><input id="nn" placeholder="Name" style="border:0;background:none;width:100%"></div>${[['nk','kcal'],['np','Protein'],['nc','Kohlenhydrate'],['nf','Fett'],['nu','Gramm pro Stück (optional)']].map(([i,n])=>`<div class="it"><label>${n}</label><input type="number" id="${i}"></div>`).join('')}
      <div class="it"><input id="nun" placeholder="Name der Einheit (z. B. Scheibe)" style="border:0;background:none;width:100%"></div><div class="btnrow"><button class="btn fill" id="nsave">Speichern</button></div></div>
      <div class="sec"><h3>Neues Rezept (je Portion)</h3><div class="it"><input id="rn" placeholder="Name" style="border:0;background:none;width:100%"></div>${[['rk','kcal'],['rp','Protein'],['rc','Kohlenhydrate'],['rf','Fett']].map(([i,n])=>`<div class="it"><label>${n}</label><input type="number" id="${i}"></div>`).join('')}<div class="btnrow"><button class="btn fill" id="rsave">Speichern</button></div></div>`;
    const b=sh.el.querySelector('#dbb');b.innerHTML=h;
    b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{tab=x.dataset.t;draw()});
    b.querySelectorAll('[data-dr]').forEach(x=>x.onclick=()=>{S.myRecipes=S.myRecipes.filter(r=>r.id!==x.dataset.dr);save();draw()});
    b.querySelectorAll('[data-df]').forEach(x=>x.onclick=()=>{S.myFoods=S.myFoods.filter(r=>r.id!==x.dataset.df);save();draw()});
    b.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openRecipe(x.dataset.open,1));
    const v=i=>+String((b.querySelector('#'+i)||{}).value||0).replace(',','.');
    const ns=b.querySelector('#nsave');if(ns)ns.onclick=()=>{const n=b.querySelector('#nn').value.trim();if(!n){toast('Name fehlt');return}S.myFoods.push({id:'mf'+Date.now(),n,k:v('nk'),p:v('np'),c:v('nc'),f:v('nf'),u:v('nu')||null,un:v('nu')?(b.querySelector('#nun').value.trim()||'Stück'):null});save();toast('Gespeichert');tab='food';draw()};
    const rs=b.querySelector('#rsave');if(rs)rs.onclick=()=>{const n=b.querySelector('#rn').value.trim();if(!n){toast('Name fehlt');return}S.myRecipes.push({id:'mr'+Date.now(),name:n,short:'eigenes Rezept',kcal:v('rk'),p:v('rp'),c:v('rc'),f:v('rf')});save();toast('Gespeichert');tab='rec';draw()}};draw()}
function calSummary(d){const T=calTarget(d),E=foodTotals(d);
  return `<button class="csum" id="csum"><div><b>Ernährung</b><small>${E.k} / ${T.k} kcal · P ${E.p}/${T.p} · KH ${E.c}/${T.c} · F ${E.f}/${T.f} g</small></div><div class="ring" style="--v:${Math.min(100,E.k/T.k*100)}"><span>${Math.round(E.k/T.k*100)}%</span></div></button>`}

/* ---------- Plus-Button: Vorschläge ---------- */
function plusSuggest(cat,d){
  if(cat==='lernen'){const out=[];allSegs().forEach(x=>{const e=EV.find(z=>z.id===x.id);if(!e||!x.code)return;const dist=Math.abs((parse(e.date)-parse(d))/864e5);if(e.date<addD(d,-7))return;
      segTasks(x.id).forEach(t=>{if(t.move&&!S.td[t.key])out.push({lab:t.t,sub:`${WD[wdi(e.date)]} ${shortD(e.date)} · ${CODE_NAMES[x.code]} · ${e.title}`,ref:{t:'learn',key:t.key},dist,dur:60})})});
    return out.sort((a,b)=>a.dist-b.dist).slice(0,10)}
  if(cat==='sport')return EV.filter(e=>e.sess&&e.sess.kind!=='morning'&&!isDone(e)&&e.date>=addD(d,-3)).slice(0,8).map(e=>({lab:e.title,sub:`${WD[wdi(e.date)]} ${shortD(e.date)} · ${hm(e.start)}–${hm(e.end)} · Woche ${e.pw}`,ref:{t:'move',id:e.id},dur:e.end-e.start}));
  if(cat==='schach')return EV.filter(e=>e.chess&&!isDone(e)&&e.date>=addD(d,-3)).slice(0,8).map(e=>({lab:e.title,sub:`${WD[wdi(e.date)]} ${shortD(e.date)} · ${e.sub}`,ref:{t:'move',id:e.id},dur:e.end-e.start}));
  return []}

/* ---------- Schach ---------- */
function chessDetail(e){const C=DATA.chess,W=C.weeks[e.chess.w-1];const rules=C.rules.filter(r=>r.w.split(/[,–\s]+/).some(x=>x&&(+x===e.chess.w||(r.w.includes('–')&&e.chess.w>=+r.w.split('–')[0]&&e.chess.w<=+r.w.split('–')[1]))));
  return `<div class="chesscard"><small>Woche ${W.w} · Ziel-Elo ${W.elo}</small><b>${esc(W.theme)}</b><span>Warm-up: ${esc(W.puzzles)}</span></div>
   <div class="sec"><h3>Ablauf (30 Min)</h3><div class="note">0–5 Min Lernen · 5–25 Min Spielen (Rapid 10+0) · 25–30 Min Fehler beheben. 2. Partie nur, wenn die erste bis Minute 12 vorbei ist.</div></div>
   ${rules.length?`<div class="sec"><h3>Gotham-Regeln dieser Woche</h3>${rules.map(r=>`<div class="task"><span class="stepn" style="background:var(--c-schach)">${r.n}</span><span><b>${esc(r.t)}</b><br><small style="color:var(--text2)">${esc(r.d)}</small></span></div>`).join('')}</div>`:''}
   <details class="sec" style="padding-bottom:6px"><summary style="padding:12px 16px;cursor:pointer;font-weight:600">Blunder-Checkliste vor jedem Zug</summary>${C.check.map((t,i)=>`<div class="task"><span class="stepn" style="background:var(--c-schach)">${i+1}</span><span>${esc(t)}</span></div>`).join('')}</details>
   ${e.chess.wd==='Mi'?`<details class="sec" style="padding-bottom:6px"><summary style="padding:12px 16px;cursor:pointer;font-weight:600">London-Aufbau</summary>${C.london.setup.map(t=>`<div class="task"><span>${esc(t)}</span></div>`).join('')}</details>`:''}`}

/* ---------- Start ---------- */
if(!S.seeded){S.todos.push({id:'td-prep0',text:'Vor dem Start: Mealprep für Mo–Mi (23.–25.11.) – 3 Gerichte, siehe Bereiche › Mealprep',date:'2026-11-22',cat:'meal',prio:1,done:false},{id:'td-blut',text:'Blutbild beim Hausarzt: Vitamin D, Ferritin, B12, Zink',date:'2026-11-24',cat:'sport',prio:2,done:false,note:'Aus deinem Ernährungsplan (Testosteron-Basis).'});S.seeded=1;save()}
if(!S.ui.sel){const t=today();S.ui.sel=t<START?START:t}
refresh();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
